<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; script-src-attr 'none'; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://fonts.googleapis.com; font-src 'self' https://cdnjs.cloudflare.com https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'">
  <link rel="stylesheet" href="assets/css/shared.css">
  <script type="module" src="assets/js/lib/site.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - JobLink</title>
  <link rel="stylesheet" href="assets/css/pages/register.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <script type="module" src="assets/js/pages/register.js"></script>
  <link rel="stylesheet" href="assets/css/design.css">
</head>
<body>
  
  <header class="site-header"><nav class="site-nav" aria-label="Main navigation" data-site-nav>
<a class="site-brand" href="index.html"><i class="fas fa-handshake" aria-hidden="true"></i>JobLink</a>
<button class="site-menu-toggle" type="button" aria-label="Open navigation" aria-expanded="false" aria-controls="siteLinks"><i class="fas fa-bars" aria-hidden="true"></i></button>
<ul class="site-links" id="siteLinks"><li><a href="jobs.html">Find jobs</a></li><li><a href="register.html?type=employer">For employers</a></li><li><a href="about.html">About</a></li><li data-account-nav><a href="login.html">Sign in</a></li><li data-guest-register><a class="button" href="register.html">Create account</a></li></ul>
</nav></header>

  
  <section class="signup-section">
    <div class="signup-container">
      <div class="signup-card">
        <div class="signup-header">
          <h1>Create Account</h1>
          <p>Create your job seeker or employer account</p>
        </div>

        <form id="signupForm" class="signup-form">
          <div class="success-message" id="successMessage" role="status"></div>
          <fieldset class="role-choice"><legend>I want to</legend><div class="role-options"><label class="role-option"><input type="radio" name="accountRole" value="seeker" required> Find a job</label><label class="role-option"><input type="radio" name="accountRole" value="employer" required> Hire people</label></div><input type="hidden" id="userType" name="userType"><div class="error-message" id="userTypeError" role="alert"></div></fieldset>
<div class="google-sign-in-section">
  <button type="button" id="googleSignIn" class="google-sign-in" aria-describedby="googleSignInStatus" disabled><img src="assets/images/google-g.png" width="20" height="20" alt="">Continue with Google</button>
  <p id="googleSignInStatus" class="provider-status" role="status">Checking Google sign-in...</p>
  <p id="googleSignInError" class="inline-error" role="alert"></p>
  <div class="auth-divider"><span>or continue with email</span></div>
</div>


          
          <div class="form-group">
            <label for="fullName">Full Name</label>
            <div class="input-with-icon">
              <i class="fas fa-user"></i>
              <input type="text" id="fullName" name="fullName" autocomplete="name" placeholder="Enter your full name" required>
            </div>
            <div class="error-message" id="fullNameError"></div>
          </div>

          <div class="form-group">
            <label for="email">Email Address</label>
            <div class="input-with-icon">
              <i class="fas fa-envelope"></i>
              <input type="email" id="email" name="email" autocomplete="email" placeholder="Enter your email" required>
            </div>
            <div class="error-message" id="emailError"></div>
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <div class="input-with-icon">
              <i class="fas fa-lock"></i>
              <input type="password" id="password" name="password" autocomplete="new-password" placeholder="Create a password" required>
              <button type="button" class="toggle-password" id="togglePassword" aria-label="Show password">
                <i class="fas fa-eye"></i>
              </button>
            </div>
            <div class="error-message" id="passwordError"></div>
          </div>

          <button type="submit" class="btn btn-primary btn-signup" id="signupButton">
            <span class="btn-text">Create Account</span>
            <div class="btn-loader" id="btnLoader">
              <div class="loader"></div>
            </div>
          </button>
        </form>

        <div class="signup-footer">
          <p>Already have an account? <a href="login.html">Sign in</a></p>
        </div>
      </div>
    </div>
  </section>
</body>
</html>
