<!DOCTYPE html>
<html lang="en">
<head>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; script-src-attr 'none'; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://fonts.googleapis.com; font-src 'self' https://cdnjs.cloudflare.com https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'">
  <link rel="stylesheet" href="assets/css/shared.css">
  <script type="module" src="assets/js/lib/site.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | JobLink</title>
    <link rel="stylesheet" href="assets/css/pages/login.css">
    <script type="module" src="assets/js/pages/forgot-password.js"></script>
  <link rel="stylesheet" href="assets/css/design.css">
</head>
<body>
    <main class="login-section">
        <div class="login-container"><div class="login-card">
            <h1>Reset your password</h1>
            <p id="resetStatus" role="status">Enter your email to request a password reset link.</p>
            <form id="resetForm" class="login-form">
                <div class="form-group" id="emailGroup">
                    <label for="email">Email address</label>
                    <input id="email" type="email" autocomplete="email" required>
                </div>
                <div class="form-group" id="passwordGroup" hidden>
                    <label for="password">New password</label>
                    <input id="password" type="password" autocomplete="new-password" minlength="6">
                </div>
                <button id="resetButton" type="submit" class="login-btn">Send reset link</button>
            </form>
            <p><a href="login.html">Back to login</a></p>
        </div></div>
    </main>
</body>
</html>
